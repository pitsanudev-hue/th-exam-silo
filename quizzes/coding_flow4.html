        // Render Side Menu
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            problemData.forEach(cat => {
                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.innerText = cat.category;
                container.appendChild(catTitle);

                const ul = document.createElement('ul');
                ul.className = 'problem-list';

                cat.problems.forEach(prob => {
                    const li = document.createElement('li');
                    li.className = 'problem-item';
                    li.id = `menu-${prob.id}`;
                    li.innerText = prob.title;
                    li.onclick = () => loadProblem(prob.id);
                    ul.appendChild(li);
                });

                container.appendChild(ul);
            });
        }

        // Shuffle Array (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            let arr = [...array];
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
            }
            return arr;
        }

        // Load Problem into Main View
        function loadProblem(problemId) {

            problemData.forEach(cat => {

                });
            });

            if (!currentProb) return;

            // Highlight menu
            document.querySelectorAll('.problem-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`menu-${problemId}`).classList.add('active');

            // Save correct sequence
            currentAlgorithmCorrect = [...currentProb.algorithm];

            // Shuffle for puzzle (Ensure it's actually shuffled if length > 1)
            let shuffledAlgo = shuffle(currentProb.algorithm);
            if (currentProb.algorithm.length > 1) {
                while (JSON.stringify(shuffledAlgo) === JSON.stringify(currentProb.algorithm)) {
                    shuffledAlgo = shuffle(currentProb.algorithm);
                }
            }

            // Render Card
            const card = document.getElementById('problem-card');
            card.innerHTML = `
                <span class="badge">${currentProb.year}</span>
                <h1>${currentProb.title}</h1>
                
                <div class="section-title">📌 โจทย์:</div>
                <div class="problem-body">${currentProb.question}</div>

                <div class="answer-box">
                    💡 เฉลยคำตอบคณิตศาสตร์: ${currentProb.answer}
                </div>

                <div class="section-title">🎮 ภารกิจ Algorithm Puzzle: ลากเรียงลำดับขั้นตอนให้ถูกต้อง</div>
                
                <div class="puzzle-container">
                    <p class="puzzle-instruction">💡 คลิกค้างที่แถบเพื่อ **ลากสลับลำดับ** หรือกดปุ่ม 🔼 🔽 ด้านขวา เพื่อเรียงขั้นตอนการแก้โจทย์ให้ถูกต้องตามลำดับก่อน-หลัง</p>
                    
                    <ul class="draggable-list" id="algo-list">
                        ${shuffledAlgo.map((stepText, idx) => createDraggableItemHTML(stepText)).join('')}
                    </ul>

                    <div class="btn-controls">
                        <button class="btn btn-primary" onclick="checkAnswer()">🔍 ตรวจคำตอบ</button>
                        <button class="btn btn-secondary" onclick="resetPuzzle()">🔄 รีเซ็ต / สุ่มใหม่</button>
                    </div>

                    <div id="feedback" class="feedback"></div>
                </div>
            `;

            addDragAndDropListeners();
        }

        function createDraggableItemHTML(text) {
            return `
                <li class="draggable-item" draggable="true">
                    <div class="item-content">
                        <span class="drag-handle">☰</span>
                        <span class="step-text">${text}</span>
                    </div>
                    <div class="touch-btn-group">
                        <button class="btn-mini" onclick="moveUp(this)">▲</button>
                        <button class="btn-mini" onclick="moveDown(this)">▼</button>
                    </div>
                </li>
            `;
        }

        // Drag & Drop Event Handlers
        function addDragAndDropListeners() {
            const items = document.querySelectorAll('.draggable-item');

            items.forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('dragenter', handleDragEnter);
                item.addEventListener('dragleave', handleDragLeave);
                item.addEventListener('drop', handleDrop);
                item.addEventListener('dragend', handleDragEnd);
            });
        }

        function handleDragStart(e) {
            dragSrcEl = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter() {
            if (this !== dragSrcEl) this.classList.add('over');
        }

        function handleDragLeave() {
            this.classList.remove('over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            if (dragSrcEl !== this) {
                dragSrcEl.innerHTML = this.innerHTML;
                this.innerHTML = e.dataTransfer.getData('text/html');
            }
            return false;
        }

        function handleDragEnd() {
            document.querySelectorAll('.draggable-item').forEach(item => {
                item.classList.remove('dragging', 'over');
            });
            // Re-bind click events for buttons in moved items
            addDragAndDropListeners();
        }

        // Button Controls for Mobile / Convenience
        function moveUp(btn) {
            const item = btn.closest('.draggable-item');
            const prev = item.previousElementSibling;
            if (prev) {
                item.parentNode.insertBefore(item, prev);
            }
        }

        function moveDown(btn) {
            const item = btn.closest('.draggable-item');
            const next = item.nextElementSibling;
            if (next) {
                item.parentNode.insertBefore(next, item);
            }
        }

        // Check Answer Algorithm
        function checkAnswer() {
            const currentItems = document.querySelectorAll('#algo-list .step-text');
            const userOrder = Array.from(currentItems).map(el => el.innerText.trim());
            const feedback = document.getElementById('feedback');

            let isCorrect = true;
            if (userOrder.length !== currentAlgorithmCorrect.length) {
                isCorrect = false;
            } else {
                for (let i = 0; i < userOrder.length; i++) {
                    if (userOrder[i] !== currentAlgorithmCorrect[i].trim()) {
                        isCorrect = false;
                        break;
                    }
                }
            }

            if (isCorrect) {
                feedback.className = "feedback success";
                feedback.innerHTML = "🎉 **ถูกต้องแล้วครับ!** น้องๆ เรียงลำดับขั้นตอน Algorithm ได้สมบูรณ์แบบมากครับ!";
            } else {
                feedback.className = "feedback error";
                feedback.innerHTML = "❌ **ยังไม่ถูกต้องครับ** ลองพิจารณาว่าขั้นตอนไหนควรทำก่อน-หลัง แล้วลองเรียงใหม่อีกครั้งนะครับ!";
            }
        }

        // Reset Puzzle
        function resetPuzzle() {
            const activeMenu = document.querySelector('.problem-item.active');
            if (activeMenu) {
                const probId = activeMenu.id.replace('menu-', '');
                loadProblem(probId);
            }
        }

        // Initialize App
        window.onload = () => {
            renderMenu();
            loadProblem('prob_01');
        };
    </script>
</body>
</html>
