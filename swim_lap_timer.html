<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swim Lap Timer</title>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --primary: #007acc;
            --primary-dark: #005999;
            --accent: #17a2b8;
            --success: #28a745;
            --danger: #dc3545;
            --text-main: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 10px 0;
            color: var(--primary-dark);
        }

        header h1 {
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-light);
        }

        select, input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fafafa;
        }

        .url-input-container {
            display: flex;
            gap: 6px;
        }

        .url-input-container input {
            flex: 1;
            font-size: 0.85rem;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 0.85rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Timer Display */
        .timer-display-container {
            text-align: center;
            padding: 10px 0;
        }

        .main-timer {
            font-size: 3.2rem;
            font-weight: 800;
            font-family: monospace;
            color: var(--primary-dark);
            line-height: 1.1;
        }

        .lap-timer-sub {
            font-size: 1.2rem;
            font-family: monospace;
            color: var(--accent);
            margin-top: 4px;
        }

        /* Progress Bar */
        .progress-container {
            margin: 10px 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .progress-bar-bg {
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Control Buttons */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-large {
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-large:active {
            transform: scale(0.98);
        }

        .btn-start { background-color: var(--success); }
        .btn-lap { background-color: var(--accent); }
        .btn-stop { background-color: var(--danger); grid-column: span 2; }

        /* Stats Summary Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-val {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-dark);
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        /* Table Area */
        .table-responsive {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary);
            color: white;
            position: sticky;
            top: 0;
        }

        tr.fastest { background-color: #d4edda; color: #155724; font-weight: bold; }
        tr.slowest { background-color: #f8d7da; color: #721c24; }

        /* Action Footer Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-sheets {
            background: #0f9d58;
            color: white;
            border: none;
        }

        /* Alert Toast */
        #statusMessage {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 8px;
            padding: 6px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏊‍♂️ Swim Lap Timer</h1>
    </header>

    <!-- App Settings Card -->
    <div class="card">
        <div class="settings-grid">
            <div class="form-group">
                <label for="stroke">ท่าว่ายน้ำ:</label>
                <select id="stroke">
                    <option value="Freestyle">ฟรีสไตล์ (Freestyle)</option>
                    <option value="Breaststroke">กบ (Breaststroke)</option>
                    <option value="Backstroke">กรรเชียง (Backstroke)</option>
                    <option value="Butterfly">ผีเสื้อ (Butterfly)</option>
                    <option value="IM">เดี่ยวผสม (IM)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="poolLength">สระยาว (เมตร):</label>
                <select id="poolLength" onchange="handlePoolLengthChange()">
                    <option value="25">25 เมตร</option>
                    <option value="50" selected>50 เมตร</option>
                    <option value="custom">กำหนดเอง (Custom)...</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label for="targetDistance">เป้าหมายระยะทางรวม (เมตร):</label>
                <select id="targetDistance" onchange="handleTargetDistanceChange()">
                    <option value="250">250m</option>
                    <option value="500" selected>500m</option>
                    <option value="1000">1,000m</option>
                    <option value="1500">1,500m</option>
                    <option value="custom">กำหนดเอง (Custom)...</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label for="webAppUrl">Google Web App URL (บันทึกอัตโนมัติ):</label>
                <div class="url-input-container">
                    <input type="text" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec">
                    <button class="btn-small" onclick="saveUrl()">บันทึก URL</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Timer & Display Card -->
    <div class="card">
        <div class="timer-display-container">
            <div class="main-timer" id="timerDisplay">00:00.00</div>
            <div class="lap-timer-sub">Lap: <span id="lapDisplay">00:00.00</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-info">
                <span>ระยะทาง: <strong id="currentDist">0</strong> / <span id="targetDistLbl">500</span>m</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="controls-grid">
            <button class="btn-large btn-start" id="startBtn" onclick="toggleStart()">Start</button>
            <button class="btn-large btn-lap" id="lapBtn" onclick="recordLap()" disabled>Lap</button>
            <button class="btn-large btn-stop" id="stopBtn" onclick="stopAndReset()" disabled>Stop & Reset</button>
        </div>
    </div>

    <!-- Dashboard Stats Card -->
    <div class="card">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-val" id="statDistance">0m</div>
                <div class="stat-lbl">ระยะทางรวม</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="statAvgPace">00:00</div>
                <div class="stat-lbl">Pace เฉลี่ย/100m</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="statBestPace">00:00</div>
                <div class="stat-lbl">Pace ดีที่สุด</div>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Lap</th>
                        <th>ท่า</th>
                        <th>เวลา Lap</th>
                        <th>เวลารวม</th>
                        <th>Pace</th>
                    </tr>
                </thead>
                <tbody id="lapRecords">
                    <!-- Lap items will be appended here -->
                </tbody>
            </table>
        </div>

        <div class="action-buttons">
            <button class="btn-action" onclick="copyToClipboard()">📋 คัดลอก</button>
            <button class="btn-action btn-sheets" onclick="sendToGoogleSheets()">🚀 ส่งเข้า Google Sheets</button>
        </div>
        <div id="statusMessage"></div>
    </div>

    <script>
        // System variables
        let timerInterval = null;
        let startTime = 0;
        let elapsedTime = 0;
        let lapStartTime = 0;
        let currentLapTime = 0;
        let isRunning = false;
        
        let poolLengthValue = 50;
        let targetDistanceValue = 500;
        
        let laps = []; // Memory store
        let defaultScriptURL = "https://script.google.com/macros/s/AKfycbyu2W1ijmT691tK_sxXxpGNNsczZi9jNeLqjmdSRJxSKit6Ljp840mqFhPht4uK96T6dQ/exec";

        // Audio Feedback
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // Initialize App
        window.onload = function() {
            let savedUrl = localStorage.getItem('swimWebAppUrl');
            if (savedUrl) {
                document.getElementById('webAppUrl').value = savedUrl;
            } else if (defaultScriptURL) {
                document.getElementById('webAppUrl').value = defaultScriptURL;
            }
            updateSettings();
        };

        function saveUrl() {
            let url = document.getElementById('webAppUrl').value.trim();
            localStorage.setItem('swimWebAppUrl', url);
            showStatus('บันทึก URL เรียบร้อยแล้ว', '#d4edda', '#155724');
        }

        function handlePoolLengthChange() {
            let select = document.getElementById('poolLength');
            if (select.value === 'custom') {
                let customVal = prompt("กรุณาระบุความยาวสระ (เมตร):", "33");
                if (customVal && !isNaN(customVal) && parseInt(customVal) > 0) {
                    poolLengthValue = parseInt(customVal);
                    // Create temporary option if not existing
                    let customOpt = select.querySelector('option[data-custom="true"]');
                    if (!customOpt) {
                        customOpt = document.createElement('option');
                        customOpt.setAttribute('data-custom', 'true');
                        select.appendChild(customOpt);
                    }
                    customOpt.value = poolLengthValue;
                    customOpt.innerText = `${poolLengthValue} เมตร (Custom)`;
                    select.value = poolLengthValue;
                } else {
                    select.value = poolLengthValue; // Revert
                }
            } else {
                poolLengthValue = parseInt(select.value);
            }
            calculateStats();
        }

        function handleTargetDistanceChange() {
            let select = document.getElementById('targetDistance');
            if (select.value === 'custom') {
                let customVal = prompt("กรุณาระบุเป้าหมายระยะทางรวม (เมตร):", "2000");
                if (customVal && !isNaN(customVal) && parseInt(customVal) > 0) {
                    targetDistanceValue = parseInt(customVal);
                    let customOpt = select.querySelector('option[data-custom="true"]');
                    if (!customOpt) {
                        customOpt = document.createElement('option');
                        customOpt.setAttribute('data-custom', 'true');
                        select.appendChild(customOpt);
                    }
                    customOpt.value = targetDistanceValue;
                    customOpt.innerText = `${targetDistanceValue.toLocaleString()}m (Custom)`;
                    select.value = targetDistanceValue;
                } else {
                    select.value = targetDistanceValue; // Revert
                }
            } else {
                targetDistanceValue = parseInt(select.value);
            }
            updateSettings();
        }

        function updateSettings() {
            document.getElementById('targetDistLbl').innerText = targetDistanceValue;
            calculateStats();
        }

        function formatTime(ms, includeMs = true) {
            let d = new Date(ms);
            let m = String(d.getUTCMinutes()).padStart(2, '0');
            let s = String(d.getUTCSeconds()).padStart(2, '0');
            let msNum = String(Math.floor(d.getUTCMilliseconds() / 10)).padStart(2, '0');
            return includeMs ? `${m}:${s}.${msNum}` : `${m}:${s}`;
        }

        function toggleStart() {
            playBeep();
            if (!isRunning) {
                isRunning = true;
                startTime = Date.now() - elapsedTime;
                lapStartTime = Date.now() - currentLapTime;
                
                timerInterval = setInterval(updateTimer, 10);
                
                document.getElementById('startBtn').innerText = 'Pause';
                document.getElementById('startBtn').style.backgroundColor = '#ffc107';
                document.getElementById('lapBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
            } else {
                isRunning = false;
                clearInterval(timerInterval);
                
                document.getElementById('startBtn').innerText = 'Resume';
                document.getElementById('startBtn').style.backgroundColor = 'var(--success)';
            }
        }

        function updateTimer() {
            let now = Date.now();
            elapsedTime = now - startTime;
            currentLapTime = now - lapStartTime;

            document.getElementById('timerDisplay').innerText = formatTime(elapsedTime);
            document.getElementById('lapDisplay').innerText = formatTime(currentLapTime);
        }

        function recordLap() {
            if (!isRunning && elapsedTime === 0) return;
            playBeep();

            let poolLen = poolLengthValue;
            let stroke = document.getElementById('stroke').value;
            let lapNum = laps.length + 1;
            let lapTimeMs = currentLapTime;
            let totalTimeMs = elapsedTime;

            // Pace calculation (Sec/100m)
            let paceSec = (lapTimeMs / 1000) * (100 / poolLen);
            let paceFormatted = formatTime(paceSec * 1000, false);

            laps.push({
                lapNumber: lapNum,
                stroke: stroke,
                lapTimeMs: lapTimeMs,
                lapTime: formatTime(lapTimeMs),
                totalTimeMs: totalTimeMs,
                totalTime: formatTime(totalTimeMs),
                paceSec: paceSec,
                pace: paceFormatted
            });

            lapStartTime = Date.now();
            currentLapTime = 0;
            document.getElementById('lapDisplay').innerText = "00:00.00";

            renderTable();
            calculateStats();
        }

        function renderTable() {
            let tbody = document.getElementById('lapRecords');
            tbody.innerHTML = "";

            if (laps.length === 0) return;

            let minTime = Math.min(...laps.map(l => l.lapTimeMs));
            let maxTime = Math.max(...laps.map(l => l.lapTimeMs));

            laps.slice().reverse().forEach(lap => {
                let tr = document.createElement('tr');
                if (laps.length >= 2) {
                    if (lap.lapTimeMs === minTime) tr.className = 'fastest';
                    else if (lap.lapTimeMs === maxTime) tr.className = 'slowest';
                }

                tr.innerHTML = `
                    <td>${lap.lapNumber}</td>
                    <td>${lap.stroke}</td>
                    <td>${lap.lapTime}</td>
                    <td>${lap.totalTime}</td>
                    <td>${lap.pace}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function calculateStats() {
            let poolLen = poolLengthValue;
            let targetDist = targetDistanceValue;
            let totalDist = laps.length * poolLen;

            document.getElementById('statDistance').innerText = `${totalDist}m`;
            document.getElementById('currentDist').innerText = totalDist;

            let pct = Math.min(100, Math.round((totalDist / targetDist) * 100));
            document.getElementById('progressBar').style.width = `${pct}%`;
            document.getElementById('progressPct').innerText = `${pct}%`;

            if (laps.length > 0) {
                let totalSec = elapsedTime / 1000;
                let avgPaceSec = (totalSec / totalDist) * 100;
                document.getElementById('statAvgPace').innerText = formatTime(avgPaceSec * 1000, false);

                let bestPaceSec = Math.min(...laps.map(l => l.paceSec));
                document.getElementById('statBestPace').innerText = formatTime(bestPaceSec * 1000, false);
            } else {
                document.getElementById('statAvgPace').innerText = "00:00";
                document.getElementById('statBestPace').innerText = "00:00";
            }
        }

        function stopAndReset() {
            if (confirm("ต้องการเลิกจับเวลาและรีเซ็ตข้อมูลทั้งหมดใช่หรือไม่?")) {
                playBeep();
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                elapsedTime = 0;
                currentLapTime = 0;
                laps = [];

                document.getElementById('timerDisplay').innerText = "00:00.00";
                document.getElementById('lapDisplay').innerText = "00:00.00";
                document.getElementById('startBtn').innerText = 'Start';
                document.getElementById('startBtn').style.backgroundColor = 'var(--success)';
                document.getElementById('lapBtn').disabled = true;
                document.getElementById('stopBtn').disabled = true;

                renderTable();
                calculateStats();
            }
        }

        function copyToClipboard() {
            if (laps.length === 0) {
                alert("ไม่มีข้อมูล Lap สำหรับคัดลอก");
                return;
            }

            let text = "Lap\tท่า\tเวลา Lap\tเวลารวม\tPace (/100m)\n";
            laps.forEach(l => {
                text += `${l.lapNumber}\t${l.stroke}\t${l.lapTime}\t${l.totalTime}\t${l.pace}\n`;
            });

            navigator.clipboard.writeText(text).then(() => {
                showStatus('คัดลอกข้อมูลลง คลิปบอร์ด แล้ว สามารถนำไป Paste ใน Google Sheets ได้เลย', '#d4edda', '#155724');
            });
        }

        function sendToGoogleSheets() {
            let url = document.getElementById('webAppUrl').value.trim();
            if (!url) {
                alert("กรุณาใส่ Google Web App URL ก่อนกดส่งข้อมูลครับ");
                return;
            }

            if (laps.length === 0) {
                alert("ยังไม่มีข้อมูล Lap ที่จะบันทึก");
                return;
            }

            showStatus('กำลังส่งข้อมูลลง Google Sheets...', '#fff3cd', '#856404');

            let payload = {
                timestamp: new Date().toLocaleString('th-TH'),
                laps: laps
            };

            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                showStatus('ส่งข้อมูลเข้า Google Sheets สำเร็จเรียบร้อย!', '#d4edda', '#155724');
            })
            .catch(err => {
                showStatus('เกิดข้อผิดพลาดในการส่งข้อมูล: ' + err.message, '#f8d7da', '#721c24');
            });
        }

        function showStatus(msg, bgColor, textColor) {
            let statusDiv = document.getElementById('statusMessage');
            statusDiv.innerText = msg;
            statusDiv.style.backgroundColor = bgColor;
            statusDiv.style.color = textColor;
            statusDiv.style.display = 'block';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
