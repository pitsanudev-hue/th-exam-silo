<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังแบบฝึกหัดดิจิทัล</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }

        header {
            text-align: center;
            padding: 30px 10px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2);
        }

        header h1 { font-size: 2rem; margin-bottom: 8px; }
        header p { font-size: 1rem; opacity: 0.9; }

        .container { max-width: 1000px; margin: 0 auto; }

        .category-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 25px 0 15px 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.15);
        }

        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; text-transform: capitalize; }
        .card-tag { 
            font-size: 0.75rem; 
            padding: 4px 8px; 
            background: #eef2ff; 
            color: var(--primary); 
            border-radius: 6px; 
            width: fit-content;
        }

        .status-msg {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .offline-badge {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 10px;
            color: #00b894;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎓 คลังแบบฝึกหัดดิจิทัล</h1>
            <p>Honor Pad 9 Learning Hub</p>
            <div class="offline-badge">⚡ รองรับการใช้งาน Offline</div>
        </header>

        <div id="quiz-list">
            <div class="status-msg">กำลังโหลดรายการแบบฝึกหัดจาก GitHub...</div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // ** ใส่ข้อมูล GitHub ของคุณตรงนี้ **
        // -------------------------------------------------------------
        const GITHUB_USERNAME = "pitsanudev-hue"; // เช่น "john-doe"
        const REPO_NAME = "th-exam-silo";             // เช่น "my-math-quizzes"
        // -------------------------------------------------------------

        async function loadQuizzesFromGitHub() {
            const container = document.getElementById('quiz-list');

            try {
                // ดึงรายการไฟล์ใน Repository ผ่าน GitHub API
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/quizze/`);
                
                if (!response.ok) {
                    throw new Error('ไม่สามารถเชื่อมต่อ GitHub API ได้');
                }

                const files = await response.json();

                // กรองเอาเฉพาะไฟล์ .html (ยกเว้น index.html)
                const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name.toLowerCase() !== 'index.html');

                if (htmlFiles.length === 0) {
                    container.innerHTML = '<div class="status-msg">ไม่พบไฟล์แบบฝึกหัด (.html) ใน Repository นี้</div>';
                    return;
                }

                container.innerHTML = ''; // ล้างข้อความกำลังโหลด

                const catHeader = document.createElement('div');
                catHeader.className = 'category-title';
                catHeader.innerHTML = `📌 รายการแบบฝึกหัดทั้งหมด (${htmlFiles.length} ชุด)`;
                container.appendChild(catHeader);

                const grid = document.createElement('div');
                grid.className = 'grid';

                htmlFiles.forEach(file => {
                    // แปลงชื่อไฟล์ เช่น "math_quiz_01.html" เป็น "Math Quiz 01"
                    const cleanName = file.name
                        .replace('.html', '')
                        .replace(/[-_]/g, ' ');

                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = file.name;
                    card.innerHTML = `
                        <div class="card-title">${cleanName}</div>
                        <div class="card-tag">HTML Quiz</div>
                    `;
                    grid.appendChild(card);
                });

                container.appendChild(grid);

            } catch (error) {
                console.warn("GitHub API Error (อาจจะใช้งานในโหมด Offline):", error);
                
                // หากไม่มีอินเทอร์เน็ต จะใช้การสแกนแคชเพื่อดึงไฟล์ออกมาแสดงแทน
                loadFromCache(container);
            }
        }

        // ฟังก์ชันสำรองกรณี Offline ไม่มีเน็ตดึง API
        async function loadFromCache(container) {
            if ('caches' in window) {
                const cache = await caches.open('quiz-hub-v1');
                const keys = await cache.keys();
                const cachedHtmlFiles = keys
                    .map(req => req.url)
                    .filter(url => url.endsWith('.html') && !url.endsWith('index.html'));

                if (cachedHtmlFiles.length > 0) {
                    container.innerHTML = '<div class="category-title">📌 รายการแบบฝึกหัด (โหมด Offline)</div>';
                    const grid = document.createElement('div');
                    grid.className = 'grid';

                    cachedHtmlFiles.forEach(fileUrl => {
                        const fileName = fileUrl.split('/').pop();
                        const cleanName = fileName.replace('.html', '').replace(/[-_]/g, ' ');

                        const card = document.createElement('a');
                        card.className = 'card';
                        card.href = fileName;
                        card.innerHTML = `
                            <div class="card-title">${cleanName}</div>
                            <div class="card-tag">Saved Offline</div>
                        `;
                        grid.appendChild(card);
                    });

                    container.appendChild(grid);
                    return;
                }
            }
            container.innerHTML = '<div class="status-msg">❌ ไม่สามารถดึงรายการโจทย์ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตครั้งแรกเพื่อโหลดข้อมูล</div>';
        }

        // เริ่มทำงาน
        loadQuizzesFromGitHub();

        // Register Service Worker สำหรับใช้ Offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('Offline System Ready');
            });
        }
    </script>
</body>
</html>
